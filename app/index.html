<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GemStash</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#14121f; --panel:#1e1b2e; --panel2:#272340; --text:#f3f1fb; --muted:#a39fbd;
  --accent:#ffb84d; --accent2:#7c6cff; --danger:#ff5c7a; --ok:#3ed6a0;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid #3a3558;
  border-radius:12px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent2)}
textarea{min-height:160px;resize:vertical}
#app{display:flex;flex-direction:column;height:100%}
header{padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:var(--bg);z-index:5}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.3px}
header h1 span{color:var(--accent)}
.pill{background:var(--panel2);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.pill.auto{font-weight:600}
/* (v19) comments */
.cmt{position:relative}
.cmt .cc{position:absolute;top:0;right:0;background:var(--accent);color:#1b1408;border-radius:9px;font-size:11px;font-weight:700;padding:1px 5px;min-width:16px;line-height:1.2;text-align:center}
.cmt .cc:empty{display:none}
.cmts{max-height:45vh;overflow-y:auto;margin:6px 0 10px}
.cm{background:var(--panel2);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.cm .who{font-size:13px;color:var(--accent);font-weight:600}
.cm .when{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.cm .txt{white-space:pre-wrap;margin-top:4px;line-height:1.45}
.cm .del{float:right;font-size:13px;color:var(--muted)}
.pill.auto.on{background:var(--accent);color:#1b1408}   /* (v18) auto-scroll is running */
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;display:none;padding:0 16px 24px}
.view.active{display:block}
nav{display:flex;background:var(--panel);padding:6px 6px calc(var(--safe-b) + 6px);border-top:1px solid #2c2846}
nav button{flex:1;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);border-radius:12px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--accent)}

/* feed */
#feed{padding:0;scroll-snap-type:y mandatory}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:8px 16px 16px;display:flex}
.card{flex:1;border-radius:24px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 10px 30px #0006}
.card .top{padding:22px 22px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.card .topic{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;opacity:.85}
.card h2{margin:0;font-size:24px;line-height:1.22}
.card .body{padding:18px 22px;font-size:17px;line-height:1.6;flex:1;overflow-y:auto;color:#e6e3f3;white-space:pre-wrap}
.card .src{padding:0 22px 6px;font-size:13px;color:var(--muted)}
.card .src a{color:var(--muted)}
.card .acts{display:flex;justify-content:space-around;padding:10px 8px 14px;border-top:1px solid #2c2846}
.card .acts button{font-size:22px;padding:8px 14px;border-radius:12px}
.card .acts button.saved{color:var(--accent)}
.gem{display:inline-block;opacity:.4;filter:grayscale(.7)}   /* (v13) not in a stash yet */
.saved .gem{opacity:1;filter:none;text-shadow:0 0 10px #7fd8ff}
.endslide .card{align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
.big{font-size:54px}

/* lists */
.sec{margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.row{background:var(--panel);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.row .t{flex:1;min-width:0}
.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted)}
.btn{background:var(--accent);color:#1b1408;font-weight:700;border-radius:14px;padding:13px 18px;width:100%;margin-top:10px}
.btn.alt{background:var(--panel2);color:var(--text)}
.btn.sm{width:auto;padding:9px 14px;margin:0;font-size:14px}
.btn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border-radius:18px;padding:16px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:6px}
.tile .e{font-size:26px}
.tile small{color:var(--muted)}
.mini{background:var(--panel);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.mini b{display:block;margin-bottom:6px}
.mini p{margin:0;color:#d6d2e8;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini .m{font-size:12px;color:var(--muted);margin-top:6px}
.chk{display:flex;gap:12px;align-items:flex-start}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.search{display:flex;gap:8px;margin:12px 0}
.status{color:var(--muted);font-size:14px;margin:10px 0;min-height:20px}
.status.err{color:var(--danger)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.tabs button{background:var(--panel2);border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--accent);color:#1b1408;font-weight:700}

/* sheet */
#sheet{position:fixed;inset:0;background:#0009;display:none;z-index:20;align-items:flex-end}
#sheet.on{display:flex}
#sheet .in{background:var(--panel);width:100%;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:18px 16px calc(var(--safe-b) + 18px)}
#sheet h3{margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);background:#000c;
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}

.prog{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.shelfitem{background:var(--panel);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.shelfitem .e{font-size:30px}
.shelfitem.paused{opacity:.5}
.step{display:flex;align-items:center;gap:14px}
.step button{background:var(--panel2);width:44px;height:44px;border-radius:12px;font-size:22px}
.step b{font-size:22px;min-width:30px;text-align:center}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:9px}
.seg button.on{background:var(--accent);color:#1b1408;font-weight:700}
label.l{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}

/* (v13) text cards are as long as their text: the feed scrolls down through them, then snaps to the next item.
   The buttons stay stuck to the bottom of the screen while you read. */
.slide.tall{height:auto;min-height:100%}
.slide.tall .card{overflow:clip}
.slide.tall .card .body{overflow:visible;flex:1 0 auto}
.slide.tall .card .acts{position:sticky;bottom:0;background:var(--panel);z-index:1}

/* hearts (v6): double-tap or ❤️ saves to Favorites, TikTok style */
.slide{position:relative}
.card{-webkit-user-select:none;user-select:none}
.card .acts button{padding:8px 10px}
.burst{position:absolute;font-size:110px;line-height:1;pointer-events:none;z-index:9;opacity:0;
  animation:burst .9s ease-out forwards;filter:drop-shadow(0 6px 18px #0009)}
@keyframes burst{
  0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0}
  15%{transform:translate(-50%,-50%) scale(1.25) rotate(-8deg);opacity:1}
  30%{transform:translate(-50%,-50%) scale(.92) rotate(-8deg);opacity:1}
  45%{transform:translate(-50%,-50%) scale(1.04) rotate(-8deg);opacity:1}
  75%{transform:translate(-50%,-70%) scale(1.04) rotate(-8deg);opacity:1}
  100%{transform:translate(-50%,-170%) scale(1.15) rotate(-8deg);opacity:0}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

/* (v9) article photo + full-screen posters */
.card .pic{width:calc(100% + 44px);height:170px;object-fit:cover;display:block;margin:-18px -22px 14px}   /* (v11) scrolls with the text */
.card .body .bh{display:block;color:#fff;font-size:18px;line-height:1.35;margin:4px 0 8px}   /* (v11) headings in articles */
.card .body .more{display:inline-block;background:var(--panel2);color:var(--accent);border-radius:12px;padding:10px 14px;font-size:15px;text-decoration:none}
.card.pcard{position:absolute;inset:0;border-radius:0;background:#000;box-shadow:none}
.pcard .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) brightness(.45)}
.pcard .strip{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pcard .strip::-webkit-scrollbar{display:none}
.pcard .pg{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:center;scroll-snap-stop:always}
.pcard img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px 8px 64px}
.pcard img.cfront{object-view-box:inset(0 50% 0 0)}.pcard img.cback{object-view-box:inset(0 0 0 50%)}   /* (v37) one card, two sides */
.pcard .dots{position:absolute;left:0;right:0;bottom:78px;display:flex;justify-content:center;gap:7px;pointer-events:none;z-index:2}
.pcard .dots i{width:7px;height:7px;border-radius:50%;background:#fff5}
.pcard .dots i.on{background:#fff}
.pcard .count{position:absolute;top:12px;right:12px;background:#0009;border-radius:999px;padding:5px 11px;font-size:13px;pointer-events:none;z-index:2}
.pcard .side{position:absolute;right:10px;bottom:28px;display:flex;flex-direction:column;gap:14px;z-index:2}
.pcard .side button,.pcard .side a{width:50px;height:50px;border-radius:50%;background:#0008;font-size:22px;display:flex;
  align-items:center;justify-content:center;text-decoration:none;color:#fff}
.pcard .side .saved{background:var(--accent)}
.pcard .info{position:absolute;left:0;right:70px;bottom:0;padding:16px 16px 20px;pointer-events:none;background:linear-gradient(transparent,#000b 40%)}
.pcard .info b{display:block;font-size:17px}
.pcard .info small{color:#fffb}

/* BETA: layered card — series art / video / article picture */
.card.lcard{position:absolute;inset:0;border-radius:0;background:#0b0a12;box-shadow:none;display:block}
.lcard .series{position:absolute;left:0;right:0;top:0;height:30%;background-size:cover;background-position:center}
.lcard .series video.art{width:100%;height:100%;object-fit:cover;display:block}
.lcard .series span{position:absolute;left:14px;bottom:10px;background:#000a;color:#fff;font-weight:700;font-size:15px;
  letter-spacing:.3px;border-radius:999px;padding:5px 12px}
.lcard .clipbox{position:absolute;left:0;right:0;top:30%;height:30%;background:#000;overflow:hidden}
.lcard .clipbox video{width:100%;height:100%;object-fit:cover;display:block}
.lcard .lplay{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;
  background:var(--accent);color:#1b1408;font-size:28px;font-weight:700;box-shadow:0 6px 24px #0008;z-index:2}
.lcard.audio .hero{top:30%}
.lcard.audio .lplay{top:58%}
.lcard .lplay.lread{width:auto;height:auto;border-radius:26px;padding:12px 22px;flex-direction:column;gap:2px;text-decoration:none;color:#fff;font-size:30px;display:flex;align-items:center}
.lcard .lplay.lread small{font-size:13px;font-weight:700}
.lcard.noimg .hero{background-size:cover !important}
.lcard .hero{position:absolute;left:0;right:0;top:60%;bottom:0;overflow:hidden;background:linear-gradient(135deg,#18506b,#4ad7ff)}
.lcard .hero img,.lcard .hero video.art{width:100%;height:100%;object-fit:cover;display:block}
.lcard .hero video.art{object-fit:contain;background:#000;padding-bottom:90px;box-sizing:border-box}   /* (v38) the whole title card, above the title */
.lcard .hero .ht{display:none}
.lcard.noimg .hero img{display:none}   /* the nautilus art (hero background) shows instead */
.lcard .lmeta{position:absolute;left:0;right:70px;bottom:0;padding:30px 16px 18px;background:linear-gradient(transparent,#000c 45%)}
.lcard .lmeta b{display:block;font-size:19px;line-height:1.3}
.lcard .lmeta small{color:#fffb}
.lcard .lmeta .lsrc{color:#fffb;text-decoration:underline;text-underline-offset:2px}   /* beta 16 */
.lcard .lbar{height:5px;background:#ffffff33;border-radius:9px;margin-top:10px;overflow:hidden}
.lcard .lbar i{display:block;height:100%;width:0;background:var(--accent)}
.lcard .side{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:2}
.lcard .side button,.lcard .side a{width:46px;height:46px;border-radius:50%;background:#0009;font-size:20px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff}
.lcard .side .saved{background:var(--accent)}

/* watch (v5) */
#watch{padding:0;overflow:hidden;background:#000}
#wfeed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory}
#wtop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;gap:8px;align-items:center;padding:10px 12px;
  background:linear-gradient(#000a,transparent);pointer-events:none}
#wtop *{pointer-events:auto}
#wtop .n{flex:1;font-size:13px;color:#fffc;pointer-events:none}
#wtop button{background:#0007;border-radius:999px;padding:7px 12px;font-size:13px}
.vslide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#000}
.vslide .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) brightness(.5)}
.vslide video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vslide.crop video{object-fit:cover}
.vslide .info{position:absolute;left:0;right:70px;bottom:0;padding:16px 16px 20px;pointer-events:none;
  background:linear-gradient(transparent,#000b 40%)}
.vslide .info b{display:block;font-size:17px;line-height:1.3;text-shadow:0 1px 4px #000}
.vslide .info small{color:#fffb}
.vslide .side{position:absolute;right:10px;bottom:28px;display:flex;flex-direction:column;gap:14px;z-index:2}
.vslide .side button,.vslide .side a{width:50px;height:50px;border-radius:50%;background:#0008;font-size:22px;display:flex;
  align-items:center;justify-content:center;text-decoration:none;color:#fff}
.vslide .side .saved{background:var(--accent)}
.vslide .fsx{display:none;position:absolute;top:14px;right:14px;z-index:3;width:46px;height:46px;border-radius:50%;background:#0008;color:#fff;font-size:22px}
.vslide:fullscreen .fsx{display:flex;align-items:center;justify-content:center}
.vslide:fullscreen .side,.vslide:fullscreen .info,.vslide:fullscreen .note{display:none}
.vslide:fullscreen video{object-fit:contain}
.faq{border-bottom:1px solid #ffffff1a;padding:10px 0}
.faq summary{font-weight:700;cursor:pointer;line-height:1.4}
.faq p{color:var(--muted);line-height:1.55;margin:8px 0 2px;font-size:15px}
.faq a{color:var(--accent)}
.vslide .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);z-index:2}
.vslide .note{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#000a;border-radius:999px;
  padding:8px 14px;font-size:14px;pointer-events:none;white-space:nowrap}
.vslide .playi{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:70px;pointer-events:none;opacity:.85}
.vslide.paused .playi{display:flex}
.vslide.msg{display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:var(--bg);flex-direction:column;gap:14px}
.vslide.msg p{color:var(--muted);margin:0;line-height:1.5}
.chan{background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.chan .opts{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.chan .opts select{width:auto;padding:8px}
.chan .step button{width:36px;height:36px;font-size:18px}
.chan .step b{font-size:18px;min-width:20px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Gem<span>Stash</span></h1>
    <button class="pill" id="bibleBtn" onclick="openBible()" title="Today’s Bible reading">📖 Bible</button>   <!-- (v47) -->
    <button class="pill auto" id="autoBtn" onclick="toggleAuto()" title="Auto-scroll">▶ Auto</button>   <!-- (v18) -->
    <span class="pill" id="streak">🔥 0</span>
  </header>
  <main>
    <section class="view active" id="feed"></section>
    <section class="view" id="shelf"></section>
    <section class="view" id="library"></section>
    <section class="view" id="add"></section>
    <section class="view" id="more"></section>
  </main>
  <nav>
    <button data-v="feed" class="on"><span class="ic">✨</span>Today</button>
    <button data-v="shelf"><span class="ic">📚</span>Shelf</button>
    <button data-v="library"><span class="ic">💎</span>Stashes</button>
    <button data-v="add"><span class="ic">➕</span>Add</button>
    <button data-v="more"><span class="ic">⚙️</span>More</button>
  </nav>
</div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>

<script src="sources.js?v=33"></script>   <!-- (v16) bump with each release that changes sources.js, so phones never keep an old copy -->
<script>
/* ================= storage ================= */
const KEY = 'ideastash.v1';
const READER = 'https://r.jina.ai/';
const TOPICS = {
  'Spiritual': ['#3b2a7a','#7c6cff'], 'Books': ['#7a3b1f','#ffb84d'], 'Wisdom': ['#0f5c4d','#3ed6a0'],
  'Faith': ['#1f3f7a','#5aa9ff'], 'Self-Improvement': ['#7a1f45','#ff5c9a'], 'History': ['#5b4a2a','#d6b36a'],
  'Science': ['#18506b','#4ad7ff'], 'Q&A': ['#22406e','#7cc4ff'], 'Other': ['#3a3558','#a39fbd']
};
TOPICS.Video = ['#5a1f3a','#ff6b8b'];   // (v5) videos saved from Watch
TOPICS.Family = TOPICS.Family || ['#6b2f4a','#ff9db8']; TOPICS.History = TOPICS.History || ['#5c4a1e','#e8c26a'];   // (v9)
function topicColors(t){ return TOPICS[t] || TOPICS.Other; }

let db;
function blank(){
  return { ideas: [], stashes: [{id:'fav', name:'Favorites', emoji:'⭐'}],
    daily: {date:'', ids:[]}, streak: {count:0, last:''}, seen: {}, shelf: [],
    watch: {cats: [], seen: {}, daily: {date:'', items:[], done:{}}, sound: false},
    limitMin: 20, usage: {} };   // (v8) daily scrolling time in minutes (0 = no limit)
}
function load(){
  try { const s = localStorage.getItem(KEY); if (s) return Object.assign(blank(), JSON.parse(s)); } catch(e){}
  return blank();   // (v21) no starter guide cards
}
const TLOG_KEY = 'gemstash.tlog';
let tlogBuf = []; try { tlogBuf = JSON.parse(localStorage.getItem(TLOG_KEY) || '[]'); } catch(e){}
let tlogT = 0;
function tlog(msg){                                      // (v39) time + what happened; the last 150 lines are kept
  const d = new Date(), t = d.toTimeString().slice(0, 8);
  tlogBuf.push(t + ' ' + msg); if (tlogBuf.length > 150) tlogBuf.splice(0, tlogBuf.length - 150);
  clearTimeout(tlogT); tlogT = setTimeout(() => { try { localStorage.setItem(TLOG_KEY, JSON.stringify(tlogBuf)); } catch(e){} }, 300);
}
window.addEventListener('error', e => tlog('ERROR ' + (e.message || '') + ' @' + (e.lineno || '')));
window.addEventListener('unhandledrejection', e => tlog('ERROR (promise) ' + ((e.reason && (e.reason.message || e.reason)) || '')));
function feedIdx(s){ const f = document.getElementById('feed'); return s && f ? [...f.children].indexOf(s) : -1; }
async function copyReport(){
  const f = document.getElementById('feed');
  const head = [`GemStash report ${new Date().toString().slice(0, 24)}`,
    `version: ${(document.body.innerHTML.match(/GemStash v\d+/) || [''])[0]}  screen: ${innerWidth}x${innerHeight}  standalone: ${matchMedia('(display-mode: standalone)').matches}`,
    `limit: ${db.limitMin} min, used today: ${Math.round(usedSecs() / 60)} min, time up: ${timeUp()}`,

  Tim:'Timothy',Philem:'Philemon',Heb:'Hebrews',Jas:'James',Pet:'Peter',Rev:'Revelation'};
// (v22) the phone's voice skips what's in parentheses ("(Luke 12:29-31)") and the closing publication reference
// ("w25.03 28-29 ¶10-11", "w24.12 12 ¶12-13", "ws17.01 8 ¶4"); jw.org's own recordings are left alone
function forVoice(p){
  let t = String(p || '');
  for (let k = 0; k < 3 && /\([^()]*\)/.test(t); k++) t = t.replace(/\s*\([^()]*\)/g, '');   // nested ones too
  t = t.replace(/\s*\b[a-z]{1,4}\d{2}(\.\d{1,2})?\s+\d+(?:[-–,]\s*\d+)*\s*(?:¶\s*\d+(?:[-–,]\s*\d+)*)?\.?\s*$/i, '');
  return t.replace(/\s+([.,;:!?])/g, '$1').replace(/\s{2,}/g, ' ').trim();
}
function speakable(s){
  return s
    .replace(/\b([1-3]) (Sam|Ki|Chron|Cor|Thess|Tim|Pet|John)\.?(?= \d)/g, (m,n,b) => ['','First','Second','Third'][n] + ' ' + (BOOKS[b]||b))
    .replace(/\b([A-Z][a-z]{1,5})\.(?= \d)/g, (m,b) => BOOKS[b] || m)
    .replace(/(\d+):(\d+)-(\d+)/g, '$1, verses $2 to $3')
    .replace(/(\d+):(\d+)/g, '$1, verse $2')
    .replace(/[—–]/g, ', ').replace(/¶/g, 'paragraph ');
}
// (v16) jw.org's own recordings: most jw.org articles have an MP3 reading. Each list entry carries its jw.org document
// number (doc), found once from the page's <body id="midNNN">; jw.org's pub-media service gives the MP3 (open to apps).
let DOC_BY_URL = null;
function docFor(i){
  if (!i || i.video || i.image || i.pics) return '';
  if (i.doc) return i.doc;
  if (!DOC_BY_URL){ DOC_BY_URL = {}; Object.values(KIND_LIST).forEach(f => f().forEach(e => { if (e.doc) DOC_BY_URL[e.u] = e.doc; })); }
  return DOC_BY_URL[i.url] || '';
}
const listenIcon = i => docFor(i) ? '🎧' : '🔊';
let jwAudio = null;
async function jwAudioUrl(doc){
  const r = await timed(`https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?docid=${doc}&output=json&fileformat=MP3&alllangs=0&langwritten=E&txtCMSLang=E`, 20000);
  const f = (await r.json()).files?.E?.MP3?.[0];
  if (!f) throw new Error('no recording');
  return f.file.url;
}
function setListenIcons(){ document.querySelectorAll('.card[data-id] .listen').forEach(b => {
  const id = b.closest('.card').dataset.id; b.textContent = id === speakingId ? '⏹️' : listenIcon(findIdea(id)); }); }
function stopListening(){ speakingId = null; try { speechSynthesis.cancel(); } catch(e){} if (jwAudio){ jwAudio.pause(); jwAudio = null; } setListenIcons(); }
async function listen(id){
  if (speakingId === id) return stopListening();
  stopListening();
  const i = findIdea(id); if (!i) return;
  const doc = docFor(i);
  if (doc){                                             // a real jw.org reader
    speakingId = id; setListenIcons();
    try {
      const a = new Audio(i.audio || await jwAudioUrl(doc));
      if (speakingId !== id) return;                    // stopped while we looked it up
      jwAudio = a;
      a.onended = () => { if (jwAudio === a){ jwAudio = null; speakingId = null; setListenIcons(); } };
      a.onerror = () => { if (jwAudio === a){ jwAudio = null; i.audio = ''; toast('Couldn’t play the recording'); speakingId = null; setListenIcons(); } };
      await a.play();
      if (!i.audio){ i.audio = a.src; save(); }
      return;
    } catch(e){
      if (speakingId !== id) return;
      speakingId = null; toast('Recording not available, using the phone’s voice');
    }
  }
  if (!('speechSynthesis' in window)) return toast('This browser can\'t read aloud');
  // short pieces: Chrome on Android cuts off long speech
  const parts = [i.title, ...i.body.split(/\n+/).map(x => x.replace(/^(## |• )/, ''))].map(forVoice).filter(Boolean).flatMap(p => sentences(speakable(p))).filter(s => /\w/.test(s));
  const voice = speechSynthesis.getVoices().find(v => /^en[-_]US/i.test(v.lang) && /Google/i.test(v.name)) ||
                speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
  speakingId = id; setListenIcons();
  parts.forEach((p, n) => {
    const u = new SpeechSynthesisUtterance(p);
    if (voice) u.voice = voice;
    u.rate = 1;
    if (n === parts.length - 1) u.onend = () => { if (speakingId === id){ speakingId = null; setListenIcons(); } };
    u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled' && speakingId === id) stopListening(); };
    speechSynthesis.speak(u);
  });
}

/* ================= auto-scroll (v18) ================= */
// Hands-off reading: text cards scroll down at reading pace then move on, videos play to the end, posters stay ~8 s,
// picture stories turn their pages. Touching the screen pauses it for a few seconds. The daily time limit still applies.
const READ_WPM = 200, POSTER_MS = 8000, PAGE_MS = 7000, START_MS = 1500, END_MS = 1500, TOUCH_PAUSE_MS = 6000;
let autoOn = false, autoState = null, autoHold = 0, autoLast = 0;
function setAutoButton(){ const b = document.getElementById('autoBtn'); if (!b) return; b.classList.toggle('on', autoOn); b.textContent = autoOn ? '⏸ Auto' : '▶ Auto'; }
function toggleAuto(){
  autoOn = !autoOn; db.auto = autoOn; save(); setAutoButton(); autoState = null; autoHold = 0;
  toast(autoOn ? 'Auto-scroll on: touch the screen to pause' : 'Auto-scroll off');
  if (autoOn){ autoLast = performance.now(); requestAnimationFrame(autoTick); }
}
['touchstart', 'wheel', 'mousedown', 'keydown'].forEach(ev => document.addEventListener(ev, e => {
  if (!autoOn || e.target.closest && e.target.closest('#autoBtn')) return;
  autoHold = performance.now() + TOUCH_PAUSE_MS; autoState = null;            // you're in charge for a moment
}, {passive: true}));
function autoNext(s){
  const f = document.getElementById('feed'), nx = s.nextElementSibling;
  if (!nx) return;
  f.scrollTo({top: nx.offsetTop, behavior: 'smooth'});
  autoHold = performance.now() + 1200;                                     // let the feed settle on the next item
}
function readMs(s){
  const words = (s.querySelector('.card')?.innerText || '').split(/\s+/).length;
  return Math.max(5000, words / READ_WPM * 60000);
}
function autoTick(now){
  if (!autoOn) return;
  requestAnimationFrame(autoTick);
  const dt = Math.min(200, now - autoLast); autoLast = now;
  const f = document.getElementById('feed'), s = feedCurrent;
  if (currentView !== 'feed' || document.hidden || now < autoHold || fsSlide || !s || !f.contains(s) ||
      document.getElementById('sheet').classList.contains('on')) return;
  if (!autoState || autoState.s !== s) autoState = {s, t: 0, page: 0};
  const st = autoState; st.t += dt;
  const vid = s.querySelector('video:not(.clip):not(.art)');   // BETA
  if (vid){                                                                 // videos: to the end
    if (vid.ended) autoNext(s);
    else if (vid.paused && st.t > 3000 && !s.classList.contains('paused')) vid.play().catch(() => {});
    return;
  }
  const lc = s.querySelector('.lcard');                                    // BETA layered card
  if (lc && lc.classList.contains('link')){ if (st.t > 6000) autoNext(s); return; }   // (v26): nothing to play
  if (lc){ if (lc.dataset.ended) return autoNext(s); if (!lc.dataset.started && st.t > 1500){ lc.dataset.started = '1'; layerToggle(lc.dataset.id); } return; }
  const strip = s.querySelector('.pcard .strip');
  if (strip && strip.children.length > 1){                                  // picture story: turn the pages
    const pg = Math.floor(st.t / PAGE_MS);
    if (pg >= strip.children.length) return autoNext(s);
    if (pg !== st.page){ st.page = pg; strip.scrollTo({left: pg * strip.clientWidth, behavior: 'smooth'}); }
    return;
  }
  if (s.querySelector('.pcard')) { if (st.t > POSTER_MS) autoNext(s); return; }   // single poster
  if (!s.querySelector('.card[data-id]') || s.classList.contains('timeup')) return;   // end / retry screens: stop here
  const total = readMs(s), extra = s.offsetHeight - f.clientHeight;         // text card
  if (extra > 4){                                                           // longer than the screen: glide down while you read
    const p = Math.min(1, Math.max(0, (st.t - START_MS) / (total - START_MS)));
    const want = s.offsetTop + extra * p;
    if (Math.abs(f.scrollTop - want) > 0.5) f.scrollTop = want;
    if (st.t > total + END_MS) autoNext(s);
  } else if (st.t > total) autoNext(s);
}

function toggleStash(id, sid, on){

/* ---- hearts (v6) ---- */
const isHearted = i => !!i && (i.stashes || []).includes('fav');
function ensureFav(){ if (!db.stashes.some(s => s.id === 'fav')) db.stashes.unshift({id:'fav', name:'Favorites', emoji:'⭐'}); }
function heartBurst(host, x, y){
  const b = document.createElement('div'); b.className = 'burst'; b.textContent = '❤️';
  b.style.left = x + 'px'; b.style.top = y + 'px'; host.appendChild(b); setTimeout(() => b.remove(), 950);
  try { navigator.vibrate && navigator.vibrate(15); } catch(e){}
}
function popHeart(sel){ document.querySelectorAll(sel).forEach(b => { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }); }
function heartIdea(id){
  const on = !isHearted(findIdea(id));
  ensureFav(); toggleStash(id, 'fav', on);
  if (on){
    const c = document.querySelector(`.card[data-id="${id}"]`), host = c && c.parentElement;
    if (host){ const r = c.getBoundingClientRect(), h = host.getBoundingClientRect(); heartBurst(host, r.left - h.left + r.width/2, r.top - h.top + r.height/2); }
    toast('❤️ Saved to Favorites');
  }
  popHeart(`.card[data-id="${id}"] .heart`);
}
// double-tap a card anywhere (not on a button) = heart it. Like TikTok, a double-tap never un-hearts.
let lastTap = {t:0};
document.addEventListener('click', e => {
  const card = e.target.closest('.card[data-id]');
  if (!card || e.target.closest('button,a,video,input,textarea,select,label')) return;
  const now = Date.now(), id = card.dataset.id;
  if (lastTap.id === id && now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40){
    lastTap = {t:0};
    const host = card.parentElement, h = host.getBoundingClientRect();
    heartBurst(host, e.clientX - h.left, e.clientY - h.top);
    if (!isHearted(findIdea(id))){ ensureFav(); toggleStash(id, 'fav', true); popHeart(`.card[data-id="${id}"] .heart`); }
  } else lastTap = {t:now, id, x:e.clientX, y:e.clientY};
});

/* ================= text → idea cards ================= */
function cleanMarkdown(t){
  const mc = t.indexOf('Markdown Content:'); if (mc > -1) t = t.slice(mc + 17);
  return t.replace(/!\[[^\]]*\]\([^)]*\)/g,'')          // images
          .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')        // links
          .replace(/^#{1,6}\s*/gm,'').replace(/[*_]{1,3}([^*_\n]+)[*_]{1,3}/g,'$1')
          .replace(/^\s*[-=]{3,}\s*$/gm,'').replace(/^>\s?/gm,'').replace(/\r/g,'')
          .replace(/\u200b/g,'').replace(/\s+w\d\d\.\d\d\s+\d+\s*¶[\d\-, ]+\s*$/gm,'');   // jw citation tails
}
function stripGutenberg(t){
  const s = t.search(/START OF (THE|THIS) PROJECT GUTENBERG E?BOOK[^\n]*\n/i);
  if (s > -1) t = t.slice(t.indexOf('\n', s) + 1);
  const e = t.search(/\**\s*END OF (THE|THIS) PROJECT GUTENBERG/i);
  if (e > -1) t = t.slice(0, e);
  return t;
}
function paragraphs(text){
  return text.split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g,' ').replace(/\s{2,}/g,' ').trim()).filter(Boolean);
}
function sentences(p){ return p.match(/[^.!?]+[.!?]+["'”’)]*|[^.!?]+$/g)?.map(s=>s.trim()).filter(Boolean) || [p]; }
function makeTitle(p){
  let s = sentences(p)[0].replace(/^["'“‘(]+/,'');
  s = s.charAt(0).toUpperCase() + s.slice(1);
  if (s.length <= 75) return s.replace(/[.,;:]$/,'');
  const words = s.split(' '); let out='';
  for (const w of words){ if ((out+' '+w).length > 60) break; out += (out?' ':'') + w; }
  return out.replace(/[,;:]$/,'') + '…';
}
function trimBody(p, max=900){
  if (p.length <= max) return p;
  let out=''; for (const s of sentences(p)){ if ((out+' '+s).length > max) break; out += (out?' ':'') + s; }
  return out || p.slice(0,max)+'…';
}
function goodPara(p){
  if (p.length < 140 || p.length > 1600) return false;
  if (!/[.!?]["'”’)]*$/.test(p)) return false;
  const letters = p.replace(/[^A-Za-z]/g,''); if (!letters.length) return false;
  if ((p.replace(/[^A-Z]/g,'').length / letters.length) > .5) return false;   // shouty headings
  if ((p.match(/["“”]/g)||[]).length > 6) return false;                       // heavy dialogue
  if (/^(chapter|contents|copyright|share|print|download|log in|search)/i.test(p)) return false;
  if (/cookie|javascript|privacy policy|terms of use/i.test(p)) return false;
  return sentences(p).length >= 2;
}
function textToIdeas(text, meta, limit){
  let paras = paragraphs(text).filter(goodPara);
  if (limit && paras.length > limit){
    // spread picks across the whole text, not just the start
    const step = paras.length / limit; const pick=[];
    for (let k=0;k<limit;k++) pick.push(paras[Math.floor(k*step + Math.random()*step)]);
    paras = pick;
  }
  paras = paras.map(p => p.replace(/^(?:[IVXLC]+|\d+)\.\s+/, ''));   // drop section numbers like "XIV. "
  return paras.map(p => ({id:uid(), title:makeTitle(p), body:trimBody(p), topic:meta.topic, source:meta.source, url:meta.url||'', created:Date.now(), stashes:[]}));
}

/* ================= fetching ================= */
const timed = (url, ms=20000) => fetch(url, {signal: AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined});
async function fetchText(url){
  try {
    const r = await timed(url, 12000); if (r.ok){ const t = await r.text(); if (t.length > 200) return {text:t, html:/<html|<body/i.test(t.slice(0,2000))}; }
  } catch(e){}
  const r = await timed(READER + url, 90000);
  if (!r.ok) throw new Error('Reader returned ' + r.status);
  return {text: await r.text(), html:false};
}
function htmlToText(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,nav,header,footer,noscript,aside,form,button,[role=dialog],.video-js,[class*=vjs-]').forEach(n=>n.remove());   // (v15) + video player
  const root = doc.querySelector('article, main, #article, .article') || doc.body;
  root.querySelectorAll('p,div,h1,h2,h3,li,br').forEach(n => n.insertAdjacentText('afterend','\n\n'));
  return root.textContent;
}

async function bookSearch(){
  const q = document.getElementById('bq').value.trim(); if (!q) return;
  setSt('Searching Gutenberg…'); document.getElementById('bres').innerHTML='';
  try {
    let data;
    try { data = await (await timed('https://gutendex.com/books/?languages=en&search=' + encodeURIComponent(q), 15000)).json(); }
    catch(e){   // Gutendex slow or down → read Gutenberg's own search page through the reader
      setSt('Still searching…');
      const md = await (await timed(READER + 'https://www.gutenberg.org/ebooks/search/?query=' + encodeURIComponent(q), 45000)).text();
      const results = [...md.matchAll(/\[!\[[^\]]*\]\([^)]*\)([^\]]+)\]\(https:\/\/www\.gutenberg\.org\/ebooks\/(\d+)\)/g)]
        .map(m => ({id:+m[2], title:m[1].trim(), authors:[], formats:{}}));
      data = {results};
    }
    const books = (data.results||[]).slice(0,15);
    setSt(books.length ? 'Tap a book to put it on your shelf or pick passages now.' : 'No books found (Gutenberg’s search may be busy, try again later).');
    window._books = books;
    document.getElementById('bres').innerHTML = books.map((bk,ix)=>`<button class="row" style="width:100%;text-align:left" onclick="bookChoice(${ix})">
      <span class="t"><b>${esc(bk.title)}</b><small>${esc((bk.authors||[]).map(a=>a.name).join(', ')||'Unknown')}</small></span><span>›</span></button>`).join('');
  } catch(e){ setSt('The book search is busy right now, try again later. (' + e.message + ')', true); }
}
function bookTextUrl(bk){
  const f = bk.formats || {};
  const key = Object.keys(f).find(k => k.startsWith('text/plain') && !f[k].endsWith('.zip'));
  return key ? f[key] : `https://www.gutenberg.org/cache/epub/${bk.id}/pg${bk.id}.txt`;
}
function bookChoice(ix){
  const bk = window._books[ix];
  const onShelf = (db.shelf||[]).some(it => it.kind==='book' && it.gid===bk.id);
  openSheet(`<h3>${esc(bk.title)}</h3>
    <p style="color:var(--muted);margin-top:-6px">${esc((bk.authors||[]).map(a=>a.name).join(', ')||'')}</p>
    ${onShelf ? '<p class="status">Already on your shelf.</p>' :
      `<button class="btn" onclick="closeSheet();addBookToShelf(${ix})">📚 Add to My Shelf</button>

    <button class="btn alt" onclick="closeSheet()">Cancel</button>`);

async function bookImport(ix){
  const bk = window._books[ix];
  const url = bookTextUrl(bk);
  const author = (bk.authors||[]).map(a=>a.name).join(', ');
  setSt('Downloading "' + bk.title + '"… (big books take a moment)');
  try {
    let {text} = await fetchText(url);
    text = cleanMarkdown(stripGutenberg(text));
    window._lastBook = {text, meta:{topic:'Books', source: bk.title + (author?' — '+author:''), url:`https://www.gutenberg.org/ebooks/${bk.id}`}};
    preview = textToIdeas(text, window._lastBook.meta, 25);
    setSt(preview.length ? `Found ideas in "${bk.title}". Keep the ones you like.` : 'Couldn\'t find idea-sized passages in this book.', !preview.length);
    renderPreview(true);
  } catch(e){ setSt('Download failed: ' + e.message, true); }
}
// BETA 12: today's text comes from jw.org's own "Examining the Scriptures Daily" EPUB, downloaded once a year and
// picked in GemStash. Nothing is read from jw.org's pages. The days are kept on the phone (IndexedDB 'dailytext:<year>').
const DT_NEED = 'add this year’s Daily Text';
const dtStore = y => 'dailytext:' + y;
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
// beta 14 (Mike): the Daily Text card links to the jw.org EPUB it was taken from, so it's plain where the text comes from
async function dtEpubUrl(y){
  try {
    const j = await (await timed(`https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?pub=es${String(y).slice(2)}&output=json&fileformat=EPUB&alllangs=0&langwritten=E&txtCMSLang=E`, 15000)).json();
    const f = (((j.files || {}).E || {}).EPUB || [])[0]; if (f) return f.file.url;
  } catch(e){}
  return '';
}
const dtPageUrl = y => `https://www.jw.org/finder?wtlocale=E&pub=es${String(y).slice(2)}`;   // jw.org's page for that year's book
async function getDailyCard(){
  const d = new Date(); let days = null;
  try { days = await idb.get(dtStore(d.getFullYear())); } catch(e){}
  if (!days) throw new Error(DT_NEED);
  const e = days[`${d.getMonth() + 1}-${d.getDate()}`];
  if (!e) throw new Error('today isn’t in the Daily Text book');
  const y = d.getFullYear(); db.dtLinks ||= {};
  if (!db.dtLinks[y]){ const u = await dtEpubUrl(y); if (u){ db.dtLinks[y] = u; save(); } }
  return {id:uid(), title:e.theme, body:e.body, topic:'Spiritual', source:`Examining the Scriptures Daily—${y} (jw.org EPUB) — ` + e.day,
    url:dailyTextUrl(), srcUrl: db.dtLinks[y] || dtPageUrl(y), created:Date.now(), stashes:[]};   // url stays the day's page: comments and sharing
}
// reads the EPUB; returns null when the file isn't a Daily Text book (then it's added as an ordinary book)
async function dailyTextFromEpub(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const zip = await JSZip.loadAsync(file), names = Object.keys(zip.files);
  const opf = names.find(n => /\.opf$/i.test(n)); if (!opf) return null;
  const m = (await zip.file(opf).async('text')).match(/Examining the Scriptures[^<\d]{0,20}(\d{4})/); if (!m) return null;   // its title: "Examining the Scriptures—2026 (es26-E)"
  const year = +m[1], days = {}, clean = t => t.replace(/[​­]/g, '').replace(/\s+/g, ' ').trim();
  for (const n of names.filter(n => /\.x?html?$/i.test(n))){
    const t = await zip.file(n).async('text'); if (!/themeScrp/.test(t)) continue;
    const doc = new DOMParser().parseFromString(t, 'application/xhtml+xml');
    const h = doc.querySelector('h2'), th = doc.querySelector('.themeScrp'); if (!h || !th) continue;
    const dm = clean(h.textContent).match(/([A-Z][a-z]+) (\d{1,2})$/), mo = dm ? MONTH_NAMES.indexOf(dm[1]) + 1 : 0; if (!mo) continue;
    const body = [...doc.querySelectorAll('.bodyTxt p')].map(x => clean(x.textContent)).filter(Boolean).join('\n\n');
    if (body) days[`${mo}-${+dm[2]}`] = {day: clean(h.textContent), theme: clean(th.textContent), body};
  }
  const count = Object.keys(days).length;
  if (count < 300) throw new Error(`only ${count} days found in this Daily Text file`);
  await idb.set(dtStore(year), days);
  db.dtYears = [...new Set([...(db.dtYears || []), year])].sort();
  const u = await dtEpubUrl(year); if (u){ db.dtLinks ||= {}; db.dtLinks[year] = u; }   // beta 14
  save();
  return {year, count};
}
async function pickDailyText(file){                       // the file picker on the Daily Text card / shelf sheet
  if (!file) return;
  toast('Reading the Daily Text…');
  try {
    const r = await dailyTextFromEpub(file);
    if (!r) return toast('That file isn’t Examining the Scriptures Daily');
    dailyTextAdded(r);
  } catch(e){ toast('Couldn’t read it: ' + e.message); }
}

async function getDailyCardFromWeb_retired(){            // BETA 12: retired, read wol.jw.org through r.jina.ai
  const d = new Date();

// markdown (from the reader) → plain text with "## " headings and "• " bullets, one block per paragraph
function articleBlocks(md){
  const mc = md.indexOf('Markdown Content:'); if (mc > -1) md = md.slice(mc + 17);
  const lines = md.replace(/\r/g, '').split('\n');
  const h1 = lines.findIndex(l => /^#\s+\S/.test(l) && !/Play & Download/i.test(l));   // jw.org pages: skip menu + cookie notice
  const out = [];
  let afterPic = 0, num = '', inPlayer = false, inDialog = false;                                 // picture captions follow a picture
  for (const raw of (h1 > -1 ? lines.slice(h1 + 1) : lines)){
    let l = raw.trim();
    if (!l) continue;
    if (/^#\s+Play & Download/i.test(l)) { inPlayer = true; continue; }          // jw.org video player menus
    if (inPlayer) { if (/\d{3}p\s*\(MP4/i.test(l)) inPlayer = false; continue; }
    const plain = l.replace(/^(#{1,6}|[*+-•])\s+/, '').replace(/^\*\*|\*\*$/g, '').trim();
    if (/^Beginning of dialog window/i.test(plain)) { inDialog = true; continue; }   // (v15) video player captions dialog
    if (inDialog) { if (/End of dialog window/i.test(plain)) inDialog = false; continue; }
    if (/End of dialog window/i.test(plain) || PLAYER_LINE.test(plain)) continue;      // (v15) video player menus
    const bare = l.replace(/^#{1,6}\s+/, '').replace(/^\*\*|\*\*$/g, '').trim();
    if (END_LINE.test(bare) || /^#{1,3}\s+(Related|You May Also Like|Read More)/i.test(l)) break;
    if (/^\[[a-z]\]\([^)]*#footnotesource/.test(l)) break;                     // footnote list
    const pic = l.match(/^(\d+)\.\s+\[?!\[/);                                    // "4.  [picture]" — the point's text comes next
    if (pic){ num = pic[1] + '. '; afterPic = 2; continue; }
    if (/^\[?!\[/.test(l) || /^\[!\[/.test(l)) { afterPic = 2; continue; }      // picture
    if (afterPic && l.length < 160 && !/[.!?:”"’)]$/.test(l) && !/^[#*>]/.test(l)) { afterPic--; continue; }   // its caption
    afterPic = 0;
    if (num && !/^#/.test(l)) { l = num + l; num = ''; }
    if (/^\*\s+\[\*\*.*\*\*\]\([^)]*#link\d/.test(l) || /^\*\s+\[[^\]]+\]\([^)]*#link\d/.test(l)) continue;   // "in this article" contents
    let m;
    if ((m = l.match(/^#{2,6}\s+(.+)/))) { const h = inlineMd(m[1]); if (h && !JUNK_LINE.test(h)) out.push('## ' + h); continue; }
    if ((m = l.match(/^\*\*([^*]+)\*\*:?$/))) {                                  // whole line in bold = heading / highlighted question
      const h = inlineMd(m[1]); if (!h || /\|/.test(h) || JUNK_LINE.test(h)) continue; out.push('## ' + h); continue; }
    if ((m = l.match(/^[*+-]\s+(.+)/))) { const b = inlineMd(m[1]); if (b && !JUNK_LINE.test(b)) out.push('• ' + b); continue; }
    if ((m = l.match(/^(\d+)\.\s+(.+)/))) { const b = inlineMd(m[2]); if (b) out.push(m[1] + '. ' + b); continue; }
    l = inlineMd(l.replace(/^>\s?/, ''));
    if (!l || JUNK_LINE.test(l) || PLAYER_LINE.test(l) || /cookie|JavaScript|Skip to content/i.test(l)) continue;
    out.push(l);
  }
  return out;
}
const MAX_BODY = 15000;
function joinBlocks(blocks){
  let body = '';
  for (const b of blocks){ if (body.length + b.length > MAX_BODY) { body += '\n\n…'; break; } body += (body ? '\n\n' : '') + b; }
  return body.replace(/(## [^\n]+)(\n\n## [^\n]+)+$/,'$1').replace(/\n\n## [^\n]+$/, '').trim();   // no dangling heading at the end
}
async function articleCard(entry, kind){
  const {text, html} = await fetchText(entry.u);
  const md = html ? htmlToText(text) : text;
  if (KIND_INFO[kind]) return seriesCard(entry, kind, md);
  let blocks = articleBlocks(md);
  // find the question on the page that best matches the index entry; the answer starts after it
  const want = wordsOf(entry.q); let qi = -1, best = 0;
  blocks.forEach((b, ix) => {
    const t = b.replace(/^## /, '');
    if (t.length > 320 || !/\?["”’)]*$/.test(t)) return;
    let score = 0; wordsOf(t).forEach(w => { if (want.has(w)) score++; });
    if (score > best){ best = score; qi = ix; }
  });
  const title = kind === 'bqa' || qi < 0 ? entry.q : p0(blocks[qi].replace(/^## /, '')).replace(/^(?:\d+\.\s+.*?\s+)+(?=\d+\.\s)/, '').replace(/^\d+\.\s+/, '');
  blocks = blocks.slice(qi + 1);
  const norm = t => t.replace(/^## /, '').toLowerCase().replace(/[^a-z0-9]+/g, '');   // (v15) page repeats the question
  while (blocks.length && norm(blocks[0]) === norm(title)) blocks.shift();
  if (kind === 'qfr'){                                   // a wol page can hold several Questions From Readers: stop at the next one
    const next = blocks.findIndex((b, ix) => ix > 0 && /^## .{10,320}\?["”’)]*$/.test(b) && b.length > 40);
    if (next > 0) blocks = blocks.slice(0, next);
  }
  if (kind === 'bqa') blocks = blocks.filter(b => !/^## The Bible’s answer$/i.test(b));
  const body = joinBlocks(blocks);
  if (body.replace(/## .*/g, '').trim().length < 80) throw new Error('could not read answer');
  return {id:uid(), title, body, topic:'Q&A', full:true, doc: entry.doc || '',
    source: kind==='qfr' ? 'Questions From Readers — ' + entry.ref : 'Bible Questions Answered — jw.org',
    url: entry.u, created:Date.now(), stashes:[]};
}

function seriesCard(entry, kind, md){

  let blocks = articleBlocks(md);
  const norm = t => t.replace(/^## /, '').toLowerCase().replace(/[^a-z0-9]+/g, '');   // (v15) page repeats the title
  const t0 = norm(entry.q.replace(/[—-]\s*Was It Designed\?$/, ''));
  while (blocks.length && t0 && (norm(blocks[0]) === t0 || norm(blocks[0]) === norm(entry.q))) blocks.shift();

    let first = true;
    blocks = blocks.filter(b => { if (/^“/.test(b) && /(Version|Translation|Bible)[._ ]*$/.test(b)){ const keep = first; first = false; return keep; } return true; });
  }
  const body = joinBlocks(blocks);
  const mp4 = (md.match(/https:\/\/[^\s)"']+?_r(?:480|720|360)P\.mp4/) || [])[0];
  const base = {id:uid(), doc: entry.doc || '', title:entry.q.replace(/[—-]\s*Was It Designed\?$/,'').replace(/\s+Explained—/, ' — '),
    topic:info.topic, source:info.source, url:entry.u, created:Date.now(), stashes:[], full:true};
  const words = body.replace(/## .*/g, '').trim();

}

function slimVideo(m, cat){
  const mp4 = (m.files || []).filter(f => /\.mp4$/i.test(f.progressiveDownloadURL || ''));
  const pick = ['480p','720p','360p','240p'].map(l => mp4.find(f => f.label === l)).find(Boolean) || mp4[0];
  const im = m.images || {};
  const img = (im.wss || im.lss || im.pnr || im.lsr || im.sqr || {});
  if (!pick) return null;
  return {lank: m.languageAgnosticNaturalKey, title: m.title, dur: Math.round(m.duration || 0), pub: m.firstPublished || '',
    img: img.lg || img.xl || img.sm || '', src: pick.progressiveDownloadURL, cat: cat || m.primaryCategory};
}
const catCache = {};
// (v31) a channel made of several jw.org categories: the short videos from every year's convention
const MULTI_CATS = {CONV_SHORT: ['2026Convention', '2025Convention', '2024Convention', '2023Convention', '2022Convention', '2021Convention', '2020Convention', '2019Convention']};
const MULTI_SKIP = {CONV_SHORT: /^You Are Invited|Trailer|Preview|^\d{4} Convention of Jehovah/i};   // invitations and trailers aren't worth a slot
async function catVideos(key){
  if (catCache[key]) return catCache[key];
  if (MULTI_CATS[key]){
    const all = [];
    for (const k of MULTI_CATS[key]){ try { all.push(...(await catVideos(k)).filter(v => !MULTI_SKIP[key].test(v.title)).map(v => ({...v, cat:key}))); } catch(e){} }
    if (!all.length) throw new Error('jw.org video list unavailable');
    return catCache[key] = all;
  }
  const r = await timed(`${JW_API}categories/E/${key}?detailed=1&clientType=www`, 30000);
  if (!r.ok) throw new Error('jw.org video list returned ' + r.status);
  const out = [];
  const walk = c => { (c.media || []).forEach(m => { const v = slimVideo(m, key); if (v) out.push(v); }); (c.subcategories || []).forEach(walk); };
  walk((await r.json()).category || {});
  return catCache[key] = out;
}
// today's videos: from each channel, the newest ones not seen yet (within its length limit). Not endless.
async function buildWatchDaily(){
  const W = db.watch, t = today();
  if (W.daily.date !== t) W.daily = {date:t, items:W.daily.items.filter(v => v.pasted && !W.seen[v.lank]), done:{}};
  const errors = [];
  // Mike: Morning Worship always; besides it, only ONE long video (over 5 min) a day
  const isLong = isLongV;
  for (const c of W.cats){
    if (W.daily.done[c.key]) continue;
    try {
      const have = new Set(W.daily.items.map(v => v.lank));
      let longUsed = W.daily.items.some(isLong);
      const pick = [];
      for (const v of (await catVideos(c.key)).slice().sort((a, b) => b.pub.localeCompare(a.pub))){
        if (pick.length >= c.perDay) break;
        if (W.seen[v.lank] || have.has(v.lank) || (c.maxMin && v.dur > c.maxMin * 60)) continue;
        if (clashes(v, [...W.daily.items, ...pick])) continue;            // (v12) another version of a talk already here / seen
        if (isLong(v)){ if (longUsed) continue; longUsed = true; }
        pick.push(v); have.add(v.lank);
      }
      W.daily.items.push(...pick); W.daily.done[c.key] = 1;
    } catch(e){ errors.push(CAT_NAME[c.key] || c.key); }
  }
  // Morning Worship first, then the order of your channels
  const order = k => { const i = W.cats.findIndex(c => c.key === k); return i < 0 ? 99 : i; };
  const base = W.daily.items.filter(v => !v.extra), extra = W.daily.items.filter(v => v.extra);   // (v8) explore extras stay at the end
  base.sort((a, b) => (b.pasted ? 1 : 0) - (a.pasted ? 1 : 0) || order(a.cat) - order(b.cat));
  W.daily.items = [...base, ...extra];
  save();
  return errors;
}
// (v12) one entry per video in today's list
function dedupeVideos(){
  const W = db.watch, seen = new Set(), before = W.daily.items.length;
  W.daily.items = W.daily.items.filter(v => !seen.has(v.lank) && seen.add(v.lank));
  const kept = [];
  W.daily.items = W.daily.items.filter(v => { if (!v.series && !v.pasted && kept.some(x => sameTalk(coreTitle(v.title), coreTitle(x.title)))) return false; kept.push(v); return true; });
  if (W.daily.items.length !== before) save();
}
// (v8) more short videos for the explore part of the feed, one per channel in turn (no extra Morning Worship)
async function moreVideos(k){
  const W = db.watch; if (!W.cats.length || navigator.onLine === false) return [];
  const out = [], used = new Set(W.daily.items.map(v => v.lank));
  for (let round = 0; round < 3 && out.length < k; round++){
    for (const c of W.cats){
      if (out.length >= k) break;
      if (CROP.has(c.key)) continue;
      let list; try { list = await catVideos(c.key); } catch(e){ continue; }
      const longUsed = W.daily.items.some(isLongV);
      const v = list.slice().sort((a, b) => b.pub.localeCompare(a.pub)).find(v => !W.seen[v.lank] && !used.has(v.lank)
        && (!c.maxMin || v.dur <= c.maxMin * 60) && !(isLongV(v) && longUsed) && !clashes(v, W.daily.items));
      if (!v) continue;
      used.add(v.lank); W.daily.items.push({...v, extra:true});
      out.push({v: W.daily.items[W.daily.items.length - 1], n: W.daily.items.length - 1});
    }
  }
  save(); return out;
}

  return `<div class="vslide ${CROP.has(v.cat) ? 'crop' : ''}" data-n="${n}" data-lank="${esc(v.lank)}">
    <div class="bg" style="background-image:url('${esc(v.img)}')"></div>
    <video playsinline muted preload="${n < 2 ? 'metadata' : 'none'}" poster="${esc(v.img)}" src="${esc(v.src)}"></video>
    <div class="playi">▶️</div>
    ${db.watch.sound ? '' : '<div class="note">🔇 Tap for sound</div>'}
    <div class="side">
      <button title="Heart (Favorites)" class="heart" onclick="heartVideo(${n})">${videoHearted(v) ? '❤️' : '🤍'}</button>
      <button title="Save to a stash" class="${saved ? 'saved' : ''}" onclick="saveVideo(${n})"><span class="gem">💎</span></button>

    <div class="info"><b>${esc(v.title)}</b><small>${esc(CAT_NAME[v.cat] || 'jw.org')}${v.dur ? ' · ' + fmtDur(v.dur) : ''}</small></div>

}
// (v27) full screen: the video fills the screen turned sideways; ✕ (or Back) returns to the feed
async function videoFull(btn){
  const s = btn.closest('.vslide'), vid = s && s.querySelector('video'); if (!s) return;
  fsSlide = s; feedCurrent = s; tlog('full screen on ' + feedIdx(s));                                          // (v29) this one keeps playing; nothing else may start
  document.querySelectorAll('#feed video').forEach(v => { if (v !== vid) v.pause(); });
  try {
    await (s.requestFullscreen ? s.requestFullscreen({navigationUI: 'hide'}) : s.webkitRequestFullscreen());
    try { await screen.orientation.lock('landscape'); } catch(e){}      // phones only; ignored elsewhere
    if (vid && vid.paused) vid.play().catch(() => {});
  } catch(e){ fsSlide = null; toast('Full screen isn’t available here'); }
}
function videoFullExit(){ if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement){
    try { screen.orientation.unlock(); } catch(e){}
    const s = fsSlide; viewHold = performance.now() + 1200;               // (v29) back on the same video, not the next one
    if (s){ feedCurrent = s; const f = document.getElementById('feed'); f.scrollTop = s.offsetTop; setTimeout(() => { if (s.isConnected) f.scrollTop = s.offsetTop; fsSlide = null; }, 400); }
  }
});
// (v27) turning the phone sideways while a video is on screen goes full screen too (if the phone allows it)
if (screen.orientation) screen.orientation.addEventListener('change', () => {
  viewHold = performance.now() + 1200;                                  // (v29) turning reshapes the feed for a moment
  const s = feedCurrent;
  if (!/landscape/.test(screen.orientation.type) || document.fullscreenElement || currentView !== 'feed'){
    if (s && s.isConnected) setTimeout(() => { document.getElementById('feed').scrollTop = s.offsetTop; }, 300);   // stay on it
    return;
  }
  if (!s || !s.matches('.vslide[data-n]')) return;
  const b = s.querySelector('.fsb'); if (b) videoFull(b).catch(() => {});
});
function wireVideoSlide(s){
  const vid = s.querySelector('video'), bar = s.querySelector('.bar');
  vid.addEventListener('timeupdate', () => { if (vid.duration) bar.style.width = (100 * vid.currentTime / vid.duration) + '%'; });
  vid.addEventListener('play', () => s.classList.remove('paused'));
  vid.addEventListener('pause', () => s.classList.add('paused'));
  // (v6) one tap = sound / pause; double-tap = heart (wait a moment to tell them apart)
  let tapT = null;
  vid.addEventListener('click', e => {
    if (tapT){ clearTimeout(tapT); tapT = null;
      const h = s.getBoundingClientRect(); heartBurst(s, e.clientX - h.left, e.clientY - h.top);
      if (!videoHearted(db.watch.daily.items[s.dataset.n])) heartVideo(+s.dataset.n, true);
      return; }
    tapT = setTimeout(() => { tapT = null;
      if (vid.muted){ db.watch.sound = true; save(); document.querySelectorAll('#feed .note').forEach(x => x.remove());
        document.querySelectorAll('#feed video').forEach(x => x.muted = false); if (vid.paused) vid.play(); return; }
      vid.paused ? vid.play() : vid.pause();
    }, 280);
  });
  vid.addEventListener('ended', () => { if (document.fullscreenElement === s) videoFullExit(); });   // (v27)
  // load the next one ahead of time
  vid.addEventListener('playing', () => { const nx = s.nextElementSibling?.querySelector('video'); if (nx && nx.preload === 'none') nx.preload = 'metadata'; });
}
function playSlide(s){
  const vid = s.querySelector('video');
  vid.muted = !db.watch.sound;
  vid.play().catch(() => {          // phones block sound until you tap; play silently and show the hint
    vid.muted = true; vid.play().catch(() => s.classList.add('paused'));
    if (!s.querySelector('.note')) s.insertAdjacentHTML('beforeend', '<div class="note">🔇 Tap for sound</div>');
  });
}
function videoToIdea(v){
  let i = db.ideas.find(x => x.video && x.video.lank === v.lank);
  if (!i){
    i = {id:uid(), title:v.title, body:`▶ ${fmtDur(v.dur)} video`, topic:'Video', source:(CAT_NAME[v.cat] || 'Video') + ' — jw.org',
      url:finderUrl(v.lank), created:Date.now(), stashes:[], video:{...v, pasted:undefined}};
    db.ideas.push(i); save();
  }
  return i;
}
const videoIdeaOf = v => v && db.ideas.find(x => x.video && x.video.lank === v.lank);
const videoHearted = v => isHearted(videoIdeaOf(v));
// (v6) ❤️ toggles Favorites; quiet=true is the double-tap (burst already shown, never un-hearts)
function heartVideo(n, quiet){
  const v = db.watch.daily.items[n]; if (!v) return;
  const on = !videoHearted(v);
  if (on){ ensureFav(); toggleStash(videoToIdea(v).id, 'fav', true); }
  else { const i = videoIdeaOf(v); toggleStash(i.id, 'fav', false);
    if (!i.stashes.length){ db.ideas = db.ideas.filter(x => x !== i); save(); } }   // un-hearted and in no stash: drop it
  const s = document.querySelector(`#feed .vslide[data-n="${n}"]`), b = s && s.querySelector('.heart');
  if (b){ b.textContent = on ? '❤️' : '🤍'; popHeart(`#feed .vslide[data-n="${n}"] .heart`); }
  if (on && !quiet && s){ const r = s.getBoundingClientRect(); heartBurst(s, r.width/2, r.height/2); }
  if (on) toast('❤️ Saved to Favorites');
}
function saveVideo(n){
  const v = db.watch.daily.items[n]; if (!v) return;
  const vid = document.querySelector(`#feed .vslide[data-n="${n}"] video`); vid && vid.pause();
  stashSheet(videoToIdea(v).id);
}
function channelsSheet(){
  const W = db.watch, on = k => W.cats.find(c => c.key === k);
  const lens = [[0,'Any length'],[3,'Up to 3 min'],[5,'Up to 5 min'],[10,'Up to 10 min'],[15,'Up to 15 min'],[30,'Up to 30 min'],[60,'Up to 1 hour']];
  openSheet(`<h3>📺 Channels</h3>
    <p style="color:var(--muted);margin-top:-4px;font-size:14px">Pick what comes in each day. You get the newest videos you haven't seen yet.
      Morning Worship always comes in; besides it, only one video over 5 minutes a day.</p>
    ${WATCH_GROUPS.map(([g, list]) => `<div class="sec">${esc(g)}</div>` + list.map(([k, name]) => { const c = on(k); return `
      <div class="chan"><label class="chk"><input type="checkbox" ${c ? 'checked' : ''} onchange="chanToggle('${k}', this.checked)"><b>${esc(name)}</b></label>
      ${c ? `<div class="opts"><div class="step"><button onclick="chanSet('${k}','perDay',-1)">−</button><b>${c.perDay}</b><button onclick="chanSet('${k}','perDay',1)">+</button></div>
        <span style="color:var(--muted);font-size:14px">a day</span>
        <select onchange="chanSet('${k}','maxMin',+this.value)">${lens.map(([m, l]) => `<option value="${m}" ${c.maxMin === m ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}
      </div>`; }).join('')).join('')}
    <button class="btn" onclick="closeSheet();redoWatch()">Done</button>`);
}
function chanToggle(k, yes){
  const W = db.watch;
  // short clips by default; experiences may run longer (still only one long video a day)
  const exp = WATCH_GROUPS.find(g => g[0] === 'Interviews and Experiences')[1].some(x => x[0] === k);
  if (yes && !W.cats.some(c => c.key === k)) W.cats.push({key:k, perDay:1, maxMin: CROP.has(k) ? 0 : exp ? 15 : 5});
  if (!yes){ W.cats = W.cats.filter(c => c.key !== k); W.daily.items = W.daily.items.filter(v => v.cat !== k || v.pasted || W.seen[v.lank]); }
  delete W.daily.done[k]; save(); keepSheetScroll(channelsSheet);
}
function chanSet(k, key, d){
  const c = db.watch.cats.find(x => x.key === k); if (!c) return;
  if (key === 'perDay') c.perDay = Math.min(5, Math.max(1, c.perDay + d)); else c.maxMin = d;
  // re-pick this channel's unseen videos for today with the new setting
  const W = db.watch; W.daily.items = W.daily.items.filter(v => v.cat !== k || v.pasted || W.seen[v.lank]); delete W.daily.done[k];
  save(); keepSheetScroll(channelsSheet);
}
function keepSheetScroll(fn){ const s = document.getElementById('sheetIn'), y = s.scrollTop; fn(); s.scrollTop = y; }
function redoWatch(){ if (currentView === 'shelf') renderShelf(); }   // (v8) Today re-picks on its next open
async function addVideoLink(){
  const raw = document.getElementById('vlink').value.trim(), st = document.getElementById('vst');
  let txt = raw; try { txt = decodeURIComponent(raw); } catch(e){}
  const m = txt.match(/(?:lank=|mediaitems\/[^\/?#]+\/)([\w-]+_VIDEO)\b/) || txt.match(/\b((?:pub|docid)-[\w-]+?_VIDEO)\b/);
  if (!m){ st.className = 'status err'; st.textContent = 'That doesn\'t look like a jw.org video link.'; return; }
  st.className = 'status'; st.textContent = 'Finding the video…';
  try {
    const r = await timed(`${JW_API}media-items/E/${encodeURIComponent(m[1])}?clientType=www`, 30000);
    const v = slimVideo(((await r.json()).media || [])[0] || {});
    if (!v) throw new Error('not found');
    v.pasted = true;
    const W = db.watch; W.daily.items = [v, ...W.daily.items.filter(x => x.lank !== v.lank)]; delete W.seen[v.lank]; save();
    toast('Video added: it plays right after the Daily Text'); go('feed');
  } catch(e){ st.className = 'status err'; st.textContent = 'Couldn\'t find that video: ' + e.message; }
}

}
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `gemstash-backup-${today()}.json`; a.click();
}
function importData(file){
  if (!file) return;
  file.text().then(t => {
    const d = JSON.parse(t); if (!Array.isArray(d.ideas)) throw new Error('Not a GemStash / IdeaStash backup');
    const have = new Set(db.ideas.map(i=>i.id)); const haveS = new Set(db.stashes.map(s=>s.id));
    db.ideas.push(...d.ideas.filter(i=>!have.has(i.id))); db.stashes.push(...(d.stashes||[]).filter(s=>!haveS.has(s.id)));
    const haveSh = new Set(db.shelf.map(x=>x.id)); db.shelf.push(...(d.shelf||[]).filter(x=>!haveSh.has(x.id)));
    ensureDailyShelf(); save(); toast('Backup merged'); renderMore();
  }).catch(e => toast('Import failed: ' + e.message));
}
