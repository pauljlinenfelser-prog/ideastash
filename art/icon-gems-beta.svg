<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#2a2342"/><stop offset="1" stop-color="#14121f"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#9fe3ff" stop-opacity=".35"/><stop offset="1" stop-color="#9fe3ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="dC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fdcff"/></linearGradient>
    <linearGradient id="dP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfeaff"/><stop offset="1" stop-color="#4aa8e0"/></linearGradient>
    <linearGradient id="rC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#e0244a"/></linearGradient>
    <linearGradient id="rP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0244a"/><stop offset="1" stop-color="#7a0a22"/></linearGradient>
    <linearGradient id="sC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fb0ff"/><stop offset="1" stop-color="#2e5be6"/></linearGradient>
    <linearGradient id="sP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e5be6"/><stop offset="1" stop-color="#12257a"/></linearGradient>
    <linearGradient id="eO" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf0b4"/><stop offset="1" stop-color="#0f8a55"/></linearGradient>
    <linearGradient id="eI" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4ffe0"/><stop offset="1" stop-color="#2bbf7a"/></linearGradient>
    </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="190" fill="url(#glow)"/>
  <!-- ruby, back left -->
  <g transform="translate(158,300) rotate(-14) scale(.62)">
      <polygon points="-60,-60 60,-60 100,-20 -100,-20" fill="url(#rC)"/>
      <polygon points="-100,-20 100,-20 0,100" fill="url(#rP)"/>
      <g fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round">
        <polyline points="-60,-60 -35,-20 0,-60 35,-20 60,-60"/>
        <polyline points="-100,-20 -60,-60"/><polyline points="100,-20 60,-60"/>
        <polyline points="-35,-20 0,100 35,-20"/><polyline points="-100,-20 0,100 100,-20"/>
      </g>
      <polygon points="-60,-60 0,-60 -35,-20" fill="#ffffff" fill-opacity=".35"/>
    </g>
  <!-- sapphire, back right -->
  <g transform="translate(356,300) rotate(14) scale(.62)">
      <polygon points="-60,-60 60,-60 100,-20 -100,-20" fill="url(#sC)"/>
      <polygon points="-100,-20 100,-20 0,100" fill="url(#sP)"/>
      <g fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round">
        <polyline points="-60,-60 -35,-20 0,-60 35,-20 60,-60"/>
        <polyline points="-100,-20 -60,-60"/><polyline points="100,-20 60,-60"/>
        <polyline points="-35,-20 0,100 35,-20"/><polyline points="-100,-20 0,100 100,-20"/>
      </g>
      <polygon points="-60,-60 0,-60 -35,-20" fill="#ffffff" fill-opacity=".35"/>
    </g>
  <!-- diamond, centre -->
  <g transform="translate(256,232) scale(1.12)">
      <polygon points="-60,-60 60,-60 100,-20 -100,-20" fill="url(#dC)"/>
      <polygon points="-100,-20 100,-20 0,100" fill="url(#dP)"/>
      <g fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round">
        <polyline points="-60,-60 -35,-20 0,-60 35,-20 60,-60"/>
        <polyline points="-100,-20 -60,-60"/><polyline points="100,-20 60,-60"/>
        <polyline points="-35,-20 0,100 35,-20"/><polyline points="-100,-20 0,100 100,-20"/>
      </g>
      <polygon points="-60,-60 0,-60 -35,-20" fill="#ffffff" fill-opacity=".35"/>
    </g>
  <!-- emerald (step cut), front -->
  <g transform="translate(256,372)">
    <polygon points="-62,-30 62,-30 78,-14 78,14 62,30 -62,30 -78,14 -78,-14" fill="url(#eO)"/>
    <polygon points="-42,-14 42,-14 50,-6 50,6 42,14 -42,14 -50,6 -50,-6" fill="url(#eI)"/>
    <g stroke="#ffffff" stroke-opacity=".5" stroke-width="2.5" fill="none">
      <line x1="-62" y1="-30" x2="-42" y2="-14"/><line x1="62" y1="-30" x2="42" y2="-14"/>
      <line x1="-62" y1="30" x2="-42" y2="14"/><line x1="62" y1="30" x2="42" y2="14"/>
      <line x1="-78" y1="0" x2="-50" y2="0"/><line x1="78" y1="0" x2="50" y2="0"/>
    </g>
  </g>
  <!-- sparkles -->
  <g fill="#FFD56B">
    <path d="M368 128 L375 148 L395 155 L375 162 L368 182 L361 162 L341 155 L361 148 Z"/>
    <path d="M140 170 L144 181 L155 185 L144 189 L140 200 L136 189 L125 185 L136 181 Z"/>
    <path d="M330 92 L333 100 L341 103 L333 106 L330 114 L327 106 L319 103 L327 100 Z" fill-opacity=".8"/>
