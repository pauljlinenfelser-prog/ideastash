  <!-- beta badge (2026-11-17): pink B, kept inside the maskable safe zone -->
  <circle cx="362" cy="150" r="58" fill="#ff6b8b" stroke="#14121f" stroke-width="8"/>
  <text x="362" y="175" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="74" fill="#fff">B</text>
</svg>
