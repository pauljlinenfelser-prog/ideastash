<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IdeaStash</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#14121f; --panel:#1e1b2e; --panel2:#272340; --text:#f3f1fb; --muted:#a39fbd;
  --accent:#ffb84d; --accent2:#7c6cff; --danger:#ff5c7a; --ok:#3ed6a0;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid #3a3558;
  border-radius:12px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent2)}
textarea{min-height:160px;resize:vertical}
#app{display:flex;flex-direction:column;height:100%}
header{padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:var(--bg);z-index:5}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.3px}
header h1 span{color:var(--accent)}
.pill{background:var(--panel2);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;display:none;padding:0 16px 24px}
.view.active{display:block}
nav{display:flex;background:var(--panel);padding:6px 6px calc(var(--safe-b) + 6px);border-top:1px solid #2c2846}
nav button{flex:1;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);border-radius:12px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--accent)}

/* feed */
#feed{padding:0;scroll-snap-type:y mandatory}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:8px 16px 16px;display:flex}
.card{flex:1;border-radius:24px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 10px 30px #0006}
.card .top{padding:22px 22px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.card .topic{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;opacity:.85}
.card h2{margin:0;font-size:24px;line-height:1.22}
.card .body{padding:18px 22px;font-size:17px;line-height:1.6;flex:1;overflow-y:auto;color:#e6e3f3;white-space:pre-wrap}
.card .src{padding:0 22px 6px;font-size:13px;color:var(--muted)}
.card .src a{color:var(--muted)}
.card .acts{display:flex;justify-content:space-around;padding:10px 8px 14px;border-top:1px solid #2c2846}
.card .acts button{font-size:22px;padding:8px 14px;border-radius:12px}
.card .acts button.saved{color:var(--accent)}
.endslide .card{align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
.big{font-size:54px}

/* lists */
.sec{margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.row{background:var(--panel);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.row .t{flex:1;min-width:0}
.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted)}
.btn{background:var(--accent);color:#1b1408;font-weight:700;border-radius:14px;padding:13px 18px;width:100%;margin-top:10px}
.btn.alt{background:var(--panel2);color:var(--text)}
.btn.sm{width:auto;padding:9px 14px;margin:0;font-size:14px}
.btn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border-radius:18px;padding:16px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:6px}
.tile .e{font-size:26px}
.tile small{color:var(--muted)}
.mini{background:var(--panel);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.mini b{display:block;margin-bottom:6px}
.mini p{margin:0;color:#d6d2e8;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini .m{font-size:12px;color:var(--muted);margin-top:6px}
.chk{display:flex;gap:12px;align-items:flex-start}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.search{display:flex;gap:8px;margin:12px 0}
.status{color:var(--muted);font-size:14px;margin:10px 0;min-height:20px}
.status.err{color:var(--danger)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.tabs button{background:var(--panel2);border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--accent);color:#1b1408;font-weight:700}

/* sheet */
#sheet{position:fixed;inset:0;background:#0009;display:none;z-index:20;align-items:flex-end}
#sheet.on{display:flex}
#sheet .in{background:var(--panel);width:100%;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:18px 16px calc(var(--safe-b) + 18px)}
#sheet h3{margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translateX(-50%);background:#000c;
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
label.l{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Idea<span>Stash</span></h1>
    <span class="pill" id="streak">🔥 0</span>
  </header>
  <main>
    <section class="view active" id="feed"></section>
    <section class="view" id="library"></section>
    <section class="view" id="add"></section>
    <section class="view" id="more"></section>
  </main>
  <nav>
    <button data-v="feed" class="on"><span class="ic">✨</span>Today</button>
    <button data-v="library"><span class="ic">📚</span>Stashes</button>
    <button data-v="add"><span class="ic">➕</span>Add</button>
    <button data-v="more"><span class="ic">⚙️</span>More</button>
  </nav>
</div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>

<script>
/* ================= storage ================= */
const KEY = 'ideastash.v1';
const READER = 'https://r.jina.ai/';
const TOPICS = {
  'Spiritual': ['#3b2a7a','#7c6cff'], 'Books': ['#7a3b1f','#ffb84d'], 'Wisdom': ['#0f5c4d','#3ed6a0'],
  'Faith': ['#1f3f7a','#5aa9ff'], 'Self-Improvement': ['#7a1f45','#ff5c9a'], 'History': ['#5b4a2a','#d6b36a'],
  'Science': ['#18506b','#4ad7ff'], 'Other': ['#3a3558','#a39fbd']
};
function topicColors(t){ return TOPICS[t] || TOPICS.Other; }

let db;
function blank(){
  return { ideas: [], stashes: [{id:'fav', name:'Favorites', emoji:'⭐'}],
    daily: {date:'', ids:[]}, streak: {count:0, last:''}, seen: {} };
}
function load(){
  try { const s = localStorage.getItem(KEY); if (s) return Object.assign(blank(), JSON.parse(s)); } catch(e){}
  const d = blank(); d.ideas = welcomeIdeas(); return d;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){ toast('Storage full or blocked — export a backup'); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function welcomeIdeas(){
  const mk = (title, body) => ({id:uid(), title, body, topic:'Other', source:'IdeaStash guide', url:'', created:Date.now(), stashes:[]});
  return [
    mk('Swipe up for the next idea', 'Today shows a fresh set of 5 ideas each day, pulled from everything you have imported. Keep going past them to explore more.'),
    mk('Import a whole book in seconds', 'Tap Add → Books. Search Project Gutenberg (60,000+ free public-domain books), pick one, and IdeaStash breaks it into bite-size idea cards you can keep or skip.'),
    mk('Bring in jw.org articles', 'Tap Add → Web / jw.org and paste any jw.org or wol.jw.org link, or tap "Today\'s Daily Text". The page is turned into idea cards you choose from.'),
    mk('Stash what matters', 'Tap the bookmark on any card to put it in a stash. Make as many stashes as you like — by topic, project, or talk you are preparing.'),
  ];
}

/* ================= helpers ================= */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }
function openSheet(html){ document.getElementById('sheetIn').innerHTML = html; document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
document.getElementById('sheet').addEventListener('click', e => { if (e.target.id==='sheet') closeSheet(); });
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const findIdea = id => db.ideas.find(i => i.id===id);

/* ================= navigation ================= */
let currentView = 'feed';
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
function go(v){
  currentView = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v===v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id===v));
  ({feed:renderFeed, library:renderLibrary, add:renderAdd, more:renderMore})[v]();
}

/* ================= daily + streak ================= */
function ensureDaily(){
  const t = today();
  if (db.daily.date === t && db.daily.ids.every(findIdea)) return;
  const pool = db.ideas.filter(i => !db.seen[i.id]);
  const pick = shuffle(pool.length >= 5 ? pool : db.ideas).slice(0,5);
  db.daily = {date:t, ids: pick.map(i=>i.id)};
  save();
}
function bumpStreak(){
  const t = today(); if (db.streak.last === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const ys = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  db.streak.count = db.streak.last === ys ? db.streak.count+1 : 1;
  db.streak.last = t; save(); renderStreak();
}
function renderStreak(){ document.getElementById('streak').textContent = '🔥 ' + db.streak.count; }

/* ================= card ================= */
function cardHTML(i){
  const [c1,c2] = topicColors(i.topic);
  const saved = i.stashes && i.stashes.length;
  const src = i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.source)}</a>` : esc(i.source||'');
  return `<div class="card" data-id="${i.id}">
    <div class="top" style="background:linear-gradient(135deg,${c1},${c2})">
      <div class="topic">${esc(i.topic||'Other')}</div><h2>${esc(i.title)}</h2></div>
    <div class="body">${esc(i.body)}</div>
    <div class="src">${src ? '— ' + src : ''}</div>
    <div class="acts">
      <button title="Stash" class="${saved?'saved':''}" onclick="stashSheet('${i.id}')">${saved?'🔖':'📑'}</button>
      <button title="Copy" onclick="copyIdea('${i.id}')">📋</button>
      <button title="Edit" onclick="editIdea('${i.id}')">✏️</button>
      <button title="Delete" onclick="delIdea('${i.id}')">🗑️</button>
    </div></div>`;
}

/* ================= feed ================= */
let exploreQueue = [];
function renderFeed(){
  ensureDaily();
  const el = document.getElementById('feed');
  const daily = db.daily.ids.map(findIdea).filter(Boolean);
  if (!db.ideas.length){
    el.innerHTML = `<div class="slide endslide"><div class="card"><div class="big">🌱</div><h2>No ideas yet</h2>
      <p style="color:var(--muted)">Import a book or a jw.org page to start your stash.</p>
      <button class="btn sm" onclick="go('add')">Add ideas</button></div></div>`;
    return;
  }
  exploreQueue = shuffle(db.ideas.filter(i => !db.daily.ids.includes(i.id)));
  el.innerHTML = daily.map(i => `<div class="slide">${cardHTML(i)}</div>`).join('') +
    `<div class="slide endslide" id="doneSlide"><div class="card"><div class="big">🎉</div>
      <h2>That's today's 5</h2><p style="color:var(--muted)">Streak keeps going when you finish your daily ideas.<br>Keep scrolling to explore more.</p></div></div>`;
  el.scrollTop = 0;
  observeFeed();
}
let feedObs;
function observeFeed(){
  const el = document.getElementById('feed');
  if (feedObs) feedObs.disconnect();
  feedObs = new IntersectionObserver(ents => {
    ents.forEach(en => {
      if (!en.isIntersecting) return;
      const c = en.target.querySelector('.card[data-id]');
      if (c){ db.seen[c.dataset.id] = 1; save(); }
      if (en.target.id === 'doneSlide') bumpStreak();
      if (en.target === el.lastElementChild) appendExplore();
    });
  }, {root: el, threshold: .6});
  el.querySelectorAll('.slide').forEach(s => feedObs.observe(s));
}
function appendExplore(){
  const el = document.getElementById('feed');
  if (!exploreQueue.length) exploreQueue = shuffle(db.ideas);
  exploreQueue.splice(0,5).forEach(i => {
    const s = document.createElement('div'); s.className='slide'; s.innerHTML = cardHTML(i);
    el.appendChild(s); feedObs.observe(s);
  });
}
function refreshCard(id){
  const i = findIdea(id);
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(c => {
    if (!i){ c.closest('.slide')?.remove(); return; }
    c.outerHTML = cardHTML(i);
  });
  if (currentView==='library') renderLibrary();
}

/* ================= actions ================= */
function copyIdea(id){
  const i = findIdea(id); const txt = `${i.title}\n\n${i.body}\n\n— ${i.source||''}${i.url?' '+i.url:''}`;
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Copied'), ()=>toast('Copy not allowed here'));
}
function delIdea(id){
  openSheet(`<h3>Delete this idea?</h3><p style="color:var(--muted)">${esc(findIdea(id).title)}</p>
    <button class="btn" style="background:var(--danger);color:#fff" onclick="reallyDel('${id}')">Delete</button>
    <button class="btn alt" onclick="closeSheet()">Cancel</button>`);
}
function reallyDel(id){ db.ideas = db.ideas.filter(i=>i.id!==id); save(); closeSheet(); refreshCard(id); toast('Deleted'); }
function editIdea(id){
  const i = findIdea(id);
  openSheet(`<h3>Edit idea</h3>
    <label class="l">Title</label><input id="eT" value="${esc(i.title)}">
    <label class="l">Idea</label><textarea id="eB">${esc(i.body)}</textarea>
    <label class="l">Topic</label>${topicSelect('eP', i.topic)}
    <label class="l">Source</label><input id="eS" value="${esc(i.source)}">
    <button class="btn" onclick="saveEdit('${id}')">Save</button>
    <button class="btn alt" onclick="closeSheet()">Cancel</button>`);
}
function saveEdit(id){
  const i = findIdea(id);
  i.title = document.getElementById('eT').value.trim() || i.title;
  i.body = document.getElementById('eB').value.trim() || i.body;
  i.topic = document.getElementById('eP').value; i.source = document.getElementById('eS').value.trim();
  save(); closeSheet(); refreshCard(id); toast('Saved');
}
function topicSelect(idAttr, val){
  return `<select id="${idAttr}">${Object.keys(TOPICS).map(t=>`<option ${t===val?'selected':''}>${t}</option>`).join('')}</select>`;
}
function stashSheet(id){
  const i = findIdea(id); i.stashes = i.stashes || [];
  openSheet(`<h3>Save to stash</h3>
    ${db.stashes.map(s=>`<label class="row chk"><input type="checkbox" ${i.stashes.includes(s.id)?'checked':''}
      onchange="toggleStash('${id}','${s.id}',this.checked)"><span class="t"><b>${esc(s.emoji)} ${esc(s.name)}</b></span></label>`).join('')}
    <div class="search"><input id="newStash" placeholder="New stash name"><button class="btn sm" onclick="newStash('${id}')">Add</button></div>
    <button class="btn alt" onclick="closeSheet()">Done</button>`);
}
function toggleStash(id, sid, on){
  const i = findIdea(id); i.stashes = (i.stashes||[]).filter(x=>x!==sid); if (on) i.stashes.push(sid);
  save(); refreshCard(id);
}
function newStash(id){
  const n = document.getElementById('newStash').value.trim(); if (!n) return;
  const emojis = ['📘','🕊️','💡','🌿','🔥','🧭','🏛️','🎯','🪔','📜'];
  const s = {id:uid(), name:n, emoji: emojis[db.stashes.length % emojis.length]};
  db.stashes.push(s); if (id) toggleStash(id, s.id, true); save();
  id ? stashSheet(id) : (closeSheet(), renderLibrary());
}

/* ================= library ================= */
let libFilter = 'all';
function renderLibrary(){
  const el = document.getElementById('library');
  const counts = id => db.ideas.filter(i => (i.stashes||[]).includes(id)).length;
  let list = libFilter==='all' ? db.ideas : db.ideas.filter(i => (i.stashes||[]).includes(libFilter));
  const q = (el.querySelector('#libQ')||{}).value || '';
  if (q) list = list.filter(i => (i.title+' '+i.body+' '+i.source).toLowerCase().includes(q.toLowerCase()));
  list = [...list].sort((a,b)=>b.created-a.created);
  el.innerHTML = `
    <div class="sec">Stashes</div>
    <div class="grid">
      <button class="tile" onclick="libFilter='all';renderLibrary()" style="${libFilter==='all'?'outline:2px solid var(--accent)':''}">
        <span class="e">🗂️</span><b>All ideas</b><small>${db.ideas.length} ideas</small></button>
      ${db.stashes.map(s=>`<button class="tile" onclick="libFilter='${s.id}';renderLibrary()" style="${libFilter===s.id?'outline:2px solid var(--accent)':''}">
        <span class="e">${esc(s.emoji)}</span><b>${esc(s.name)}</b><small>${counts(s.id)} ideas</small></button>`).join('')}
      <button class="tile" onclick="newStashSheet()">
        <span class="e">➕</span><b>New stash</b><small>Group ideas</small></button>
    </div>
    <div class="search"><input id="libQ" placeholder="Search ideas…" value="${esc(q)}" oninput="clearTimeout(window._q);window._q=setTimeout(()=>{renderLibrary();const x=document.getElementById('libQ');x.focus();x.setSelectionRange(x.value.length,x.value.length)},250)"></div>
    ${libFilter!=='all' && libFilter!=='fav' ? `<button class="btn alt sm" onclick="delStash('${libFilter}')">Delete this stash</button>`:''}
    <div class="sec">${list.length} ideas</div>
    ${list.slice(0,300).map(i=>`<div class="mini" onclick="viewIdea('${i.id}')"><b>${esc(i.title)}</b><p>${esc(i.body)}</p>
      <div class="m">${esc(i.topic)} · ${esc(i.source||'')}</div></div>`).join('')}
    ${list.length>300?'<div class="status">Showing newest 300 — use search to narrow.</div>':''}`;
}
function newStashSheet(){ openSheet(`<h3>New stash</h3><input id="newStash" placeholder="Name"><button class="btn" onclick="newStash()">Create</button><button class="btn alt" onclick="closeSheet()">Cancel</button>`); }
function delStash(sid){
  db.stashes = db.stashes.filter(s=>s.id!==sid);
  db.ideas.forEach(i => i.stashes = (i.stashes||[]).filter(x=>x!==sid));
  libFilter='all'; save(); renderLibrary(); toast('Stash deleted (ideas kept)');
}
function viewIdea(id){
  openSheet(`<div style="height:70vh;display:flex">${cardHTML(findIdea(id))}</div>
    <button class="btn alt" onclick="closeSheet()">Close</button>`);
}

/* ================= text → idea cards ================= */
function cleanMarkdown(t){
  const mc = t.indexOf('Markdown Content:'); if (mc > -1) t = t.slice(mc + 17);
  return t.replace(/!\[[^\]]*\]\([^)]*\)/g,'')          // images
          .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')        // links
          .replace(/^#{1,6}\s*/gm,'').replace(/[*_]{1,3}([^*_\n]+)[*_]{1,3}/g,'$1')
          .replace(/^\s*[-=]{3,}\s*$/gm,'').replace(/^>\s?/gm,'').replace(/\r/g,'')
          .replace(/\u200b/g,'').replace(/\s+w\d\d\.\d\d\s+\d+\s*¶[\d\-, ]+\s*$/gm,'');   // jw citation tails
}
function stripGutenberg(t){
  const s = t.search(/\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG[^\n]*\n/i);
  if (s > -1) t = t.slice(t.indexOf('\n', s) + 1);
  const e = t.search(/\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG/i);
  if (e > -1) t = t.slice(0, e);
  return t;
}
function paragraphs(text){
  return text.split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g,' ').replace(/\s{2,}/g,' ').trim()).filter(Boolean);
}
function sentences(p){ return p.match(/[^.!?]+[.!?]+["'”’)]*|[^.!?]+$/g)?.map(s=>s.trim()).filter(Boolean) || [p]; }
function makeTitle(p){
  let s = sentences(p)[0].replace(/^["'“‘(]+/,'');
  s = s.charAt(0).toUpperCase() + s.slice(1);
  if (s.length <= 75) return s.replace(/[.,;:]$/,'');
  const words = s.split(' '); let out='';
  for (const w of words){ if ((out+' '+w).length > 60) break; out += (out?' ':'') + w; }
  return out.replace(/[,;:]$/,'') + '…';
}
function trimBody(p, max=900){
  if (p.length <= max) return p;
  let out=''; for (const s of sentences(p)){ if ((out+' '+s).length > max) break; out += (out?' ':'') + s; }
  return out || p.slice(0,max)+'…';
}
function goodPara(p){
  if (p.length < 140 || p.length > 1600) return false;
  if (!/[.!?]["'”’)]*$/.test(p)) return false;
  const letters = p.replace(/[^A-Za-z]/g,''); if (!letters.length) return false;
  if ((p.replace(/[^A-Z]/g,'').length / letters.length) > .5) return false;   // shouty headings
  if ((p.match(/["“”]/g)||[]).length > 6) return false;                       // heavy dialogue
  if (/^(chapter|contents|copyright|share|print|download|log in|search)/i.test(p)) return false;
  if (/cookie|javascript|privacy policy|terms of use/i.test(p)) return false;
  return sentences(p).length >= 2;
}
function textToIdeas(text, meta, limit){
  let paras = paragraphs(text).filter(goodPara);
  if (limit && paras.length > limit){
    // spread picks across the whole text, not just the start
    const step = paras.length / limit; const pick=[];
    for (let k=0;k<limit;k++) pick.push(paras[Math.floor(k*step + Math.random()*step)]);
    paras = pick;
  }
  paras = paras.map(p => p.replace(/^(?:[IVXLC]+|\d+)\.\s+/, ''));   // drop section numbers like "XIV. "
  return paras.map(p => ({id:uid(), title:makeTitle(p), body:trimBody(p), topic:meta.topic, source:meta.source, url:meta.url||'', created:Date.now(), stashes:[]}));
}

/* ================= fetching ================= */
const timed = (url, ms=20000) => fetch(url, {signal: AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined});
async function fetchText(url){
  try {
    const r = await timed(url, 12000); if (r.ok){ const t = await r.text(); if (t.length > 200) return {text:t, html:/<html|<body/i.test(t.slice(0,2000))}; }
  } catch(e){}
  const r = await timed(READER + url, 90000);
  if (!r.ok) throw new Error('Reader returned ' + r.status);
  return {text: await r.text(), html:false};
}
function htmlToText(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,nav,header,footer,noscript,aside,form').forEach(n=>n.remove());
  const root = doc.querySelector('article, main, #article, .article') || doc.body;
  root.querySelectorAll('p,div,h1,h2,h3,li,br').forEach(n => n.insertAdjacentText('afterend','\n\n'));
  return root.textContent;
}

/* ================= add view ================= */
let addTab = 'books', preview = [];
function renderAdd(){
  const el = document.getElementById('add');
  el.innerHTML = `<div class="tabs">
      ${[['books','📖 Books'],['web','🌐 Web / jw.org'],['paste','📝 Paste'],['one','✍️ Write one']].map(([k,l])=>
        `<button class="${addTab===k?'on':''}" onclick="addTab='${k}';renderAdd()">${l}</button>`).join('')}</div>
    <div id="addBody"></div><div class="status" id="st"></div><div id="prev"></div>`;
  const b = document.getElementById('addBody');
  if (addTab==='books') b.innerHTML = `
      <p style="color:var(--muted);font-size:14px;margin:4px 0">Free public-domain books from Project Gutenberg.</p>
      <div class="search"><input id="bq" placeholder="Title or author (e.g. Marcus Aurelius)" onkeydown="if(event.key==='Enter')bookSearch()">
      <button class="btn sm" onclick="bookSearch()">Search</button></div><div id="bres"></div>`;
  if (addTab==='web') b.innerHTML = `
      <button class="btn alt" onclick="dailyText()">📅 Today's Daily Text (wol.jw.org)</button>
      <label class="l">Or paste a link (jw.org, wol.jw.org, any article)</label>
      <input id="wu" placeholder="https://www.jw.org/en/…" inputmode="url">
      <label class="l">Topic</label>${topicSelect('wt','Spiritual')}
      <button class="btn" onclick="webImport()">Make idea cards</button>`;
  if (addTab==='paste') b.innerHTML = `
      <label class="l">Paste text (book notes, article, study notes)</label><textarea id="pt"></textarea>
      <label class="l">Source</label><input id="ps" placeholder="e.g. Watchtower Nov 2026, p. 8">
      <label class="l">Topic</label>${topicSelect('pp','Spiritual')}
      <button class="btn" onclick="pasteImport()">Make idea cards</button>`;
  if (addTab==='one') b.innerHTML = `
      <label class="l">Title</label><input id="oT">
      <label class="l">Idea</label><textarea id="oB"></textarea>
      <label class="l">Source</label><input id="oS">
      <label class="l">Topic</label>${topicSelect('oP','Wisdom')}
      <button class="btn" onclick="writeOne()">Save idea</button>`;
  if (preview.length) renderPreview();
}
function setSt(msg, err){ const s=document.getElementById('st'); if(s){ s.textContent=msg; s.className='status'+(err?' err':''); } }

async function bookSearch(){
  const q = document.getElementById('bq').value.trim(); if (!q) return;
  setSt('Searching Gutenberg…'); document.getElementById('bres').innerHTML='';
  try {
    let data;
    try { data = await (await timed('https://gutendex.com/books/?languages=en&search=' + encodeURIComponent(q), 15000)).json(); }
    catch(e){   // Gutendex slow or down → read Gutenberg's own search page through the reader
      setSt('Still searching…');
      const md = await (await timed(READER + 'https://www.gutenberg.org/ebooks/search/?query=' + encodeURIComponent(q), 45000)).text();
      const results = [...md.matchAll(/\[!\[[^\]]*\]\([^)]*\)([^\]]+)\]\(https:\/\/www\.gutenberg\.org\/ebooks\/(\d+)\)/g)]
        .map(m => ({id:+m[2], title:m[1].trim(), authors:[], formats:{}}));
      data = {results};
    }
    const books = (data.results||[]).slice(0,15);
    setSt(books.length ? 'Tap a book to import ideas from it.' : 'No books found.');
    window._books = books;
    document.getElementById('bres').innerHTML = books.map((bk,ix)=>`<button class="row" style="width:100%;text-align:left" onclick="bookImport(${ix})">
      <span class="t"><b>${esc(bk.title)}</b><small>${esc((bk.authors||[]).map(a=>a.name).join(', ')||'Unknown')}</small></span><span>›</span></button>`).join('');
  } catch(e){ setSt('Search failed: ' + e.message, true); }
}
async function bookImport(ix){
  const bk = window._books[ix];
  const f = bk.formats || {};
  const key = Object.keys(f).find(k => k.startsWith('text/plain') && !f[k].endsWith('.zip'));
  const url = key ? f[key] : `https://www.gutenberg.org/cache/epub/${bk.id}/pg${bk.id}.txt`;
  const author = (bk.authors||[]).map(a=>a.name).join(', ');
  setSt('Downloading "' + bk.title + '"… (big books take a moment)');
  try {
    let {text} = await fetchText(url);
    text = stripGutenberg(cleanMarkdown(text));
    window._lastBook = {text, meta:{topic:'Books', source: bk.title + (author?' — '+author:''), url:`https://www.gutenberg.org/ebooks/${bk.id}`}};
    preview = textToIdeas(text, window._lastBook.meta, 25);
    setSt(preview.length ? `Found ideas in "${bk.title}". Keep the ones you like.` : 'Couldn\'t find idea-sized passages in this book.', !preview.length);
    renderPreview(true);
  } catch(e){ setSt('Download failed: ' + e.message, true); }
}
async function dailyText(){
  const d = new Date();
  const url = `https://wol.jw.org/en/wol/h/r1/lp-e/${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  setSt('Getting today\'s text…');
  try {
    const raw = (await fetchText(url)).text;
    const md = raw.includes('Markdown Content:') ? raw : (await (await fetch(READER + url)).text());
    const sections = md.split(/^##\s+/m).slice(1);
    const want = d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'}); // "Saturday, November 14"
    const sec = sections.find(x => x.startsWith(want)) || sections[Math.min(1, sections.length-1)];
    if (!sec) throw new Error('daily text not found on page');
    const lines = cleanMarkdown(sec).split('\n').map(l=>l.trim()).filter(Boolean);
    const day = lines[0], theme = lines[1] || '', body = lines.slice(2).filter(l=>!/^Examining the Scriptures Daily/.test(l)).join('\n\n');
    preview = [{id:uid(), title:theme.replace(/^_|_$/g,'').trim(), body, topic:'Spiritual',
      source:'Examining the Scriptures Daily — ' + day, url, created:Date.now(), stashes:[]}];
    setSt('Today\'s text is ready.'); renderPreview();
  } catch(e){ setSt('Could not get the daily text: ' + e.message, true); }
}
async function webImport(sourceName){
  const url = document.getElementById('wu').value.trim(); if (!/^https?:\/\//.test(url)) return setSt('Paste a full link starting with https://', true);
  const topic = document.getElementById('wt').value;
  setSt('Reading page…');
  try {
    let {text, html} = await fetchText(url);
    text = html ? htmlToText(text) : cleanMarkdown(text);
    const titleMatch = text.match(/^Title:\s*(.+)$/m);
    let source = typeof sourceName==='string' ? sourceName : (titleMatch ? titleMatch[1].trim() : new URL(url).hostname);
    preview = textToIdeas(text, {topic, source, url});
    setSt(preview.length ? `${preview.length} possible ideas. Keep the ones you like.` : 'No idea-sized paragraphs found on that page.', !preview.length);
    renderPreview();
  } catch(e){ setSt('Could not read that page: ' + e.message, true); }
}
function pasteImport(){
  const text = document.getElementById('pt').value;
  preview = textToIdeas(text, {topic:document.getElementById('pp').value, source:document.getElementById('ps').value.trim()||'My notes'});
  if (!preview.length){
    // short notes: treat each paragraph as an idea anyway
    preview = paragraphs(text).filter(p=>p.length>30).map(p=>({id:uid(), title:makeTitle(p), body:p, topic:document.getElementById('pp').value,
      source:document.getElementById('ps').value.trim()||'My notes', url:'', created:Date.now(), stashes:[]}));
  }
  setSt(preview.length ? `${preview.length} ideas ready.` : 'Nothing to import.', !preview.length);
  renderPreview();
}
function writeOne(){
  const t = document.getElementById('oT').value.trim(), b = document.getElementById('oB').value.trim();
  if (!b) return setSt('Write the idea first.', true);
  db.ideas.push({id:uid(), title:t||makeTitle(b), body:b, topic:document.getElementById('oP').value, source:document.getElementById('oS').value.trim(), url:'', created:Date.now(), stashes:[]});
  save(); toast('Idea saved'); renderAdd();
}
function renderPreview(isBook){
  const el = document.getElementById('prev'); if (!el) return;
  if (!preview.length){ el.innerHTML=''; return; }
  el.innerHTML = `<div style="display:flex;gap:8px;margin:6px 0 12px">
      <button class="btn sm alt" onclick="document.querySelectorAll('.pv').forEach(c=>c.checked=true)">All</button>
      <button class="btn sm alt" onclick="document.querySelectorAll('.pv').forEach(c=>c.checked=false)">None</button>
      ${window._lastBook && (isBook||preview[0].topic==='Books') ? `<button class="btn sm alt" onclick="moreFromBook()">🔀 Different passages</button>`:''}</div>
    ${preview.map((p,ix)=>`<label class="mini chk"><input type="checkbox" class="pv" data-ix="${ix}" checked>
      <span><b>${esc(p.title)}</b><p>${esc(p.body)}</p></span></label>`).join('')}
    <button class="btn" onclick="keepPreview()">Keep selected</button>`;
}
function moreFromBook(){ preview = textToIdeas(window._lastBook.text, window._lastBook.meta, 25); renderPreview(true); window.scrollTo(0,0); }
function keepPreview(){
  const keep = [...document.querySelectorAll('.pv')].filter(c=>c.checked).map(c=>preview[+c.dataset.ix]);
  const have = new Set(db.ideas.map(i=>i.body));
  const fresh = keep.filter(k=>!have.has(k.body));
  db.ideas.push(...fresh); save();
  preview = []; toast(`Added ${fresh.length} ideas`); renderAdd(); setSt(`Added ${fresh.length} ideas to your library.`);
}

/* ================= more / backup ================= */
function renderMore(){
  const el = document.getElementById('more');
  el.innerHTML = `
    <div class="sec">Your library</div>
    <div class="row"><span class="t"><b>${db.ideas.length} ideas · ${db.stashes.length} stashes</b><small>Saved only on this phone/browser</small></span></div>
    <div class="sec">Backup</div>
    <button class="btn" onclick="exportData()">⬇️ Export backup (.json)</button>
    <label class="btn alt" style="display:block;text-align:center">⬆️ Import backup<input type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></label>
    <div class="sec">Daily</div>
    <button class="btn alt" onclick="db.daily.date='';save();go('feed')">🔄 New set of today's ideas</button>
    <button class="btn alt" onclick="db.seen={};save();toast('Seen history cleared')">Reset "seen" history</button>
    <div class="sec">About</div>
    <p style="color:var(--muted);font-size:14px;line-height:1.5">IdeaStash v1 — free, private, no account. Books come from Project Gutenberg (public domain).
    Web pages are read through the free r.jina.ai reader. jw.org content is © Watch Tower Bible and Tract Society — for your personal study only.</p>`;
}
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ideastash-backup-${today()}.json`; a.click();
}
function importData(file){
  if (!file) return;
  file.text().then(t => {
    const d = JSON.parse(t); if (!Array.isArray(d.ideas)) throw new Error('Not an IdeaStash backup');
    const have = new Set(db.ideas.map(i=>i.id)); const haveS = new Set(db.stashes.map(s=>s.id));
    db.ideas.push(...d.ideas.filter(i=>!have.has(i.id))); db.stashes.push(...(d.stashes||[]).filter(s=>!haveS.has(s.id)));
    save(); toast('Backup merged'); renderMore();
  }).catch(e => toast('Import failed: ' + e.message));
}

/* ================= boot ================= */
db = load();
renderStreak(); renderFeed();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
